services:
  networkhub:
    build: .
    container_name: networkhub
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - networkhub-data:/app/data
      - networkhub-certs:/app/certs
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_PATH=/app/data/data.db
    restart: unless-stopped

volumes:
  networkhub-data:
  networkhub-certs:
