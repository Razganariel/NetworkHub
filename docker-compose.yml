services:
  networkhub:
    build: .
    container_name: networkhub
    ports:
      - "3331:3331"
    volumes:
      - networkhub-data:/app/data
    environment:
      - PORT=3331
      - NODE_ENV=production
      - DB_PATH=/app/data/data.db
    restart: unless-stopped

volumes:
  networkhub-data:
